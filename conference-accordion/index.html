<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Собираем конференцию целиком — BestTrip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Tokens: BestTrip design-system/tokens.css */
  :root {
    --white: #ffffff;
    --ink: #17063c;
    --indigo: #601df1;
    --purple-light-20: #dfd2fc;
    --fast: 150ms;
    --base: 250ms;
    --ease-state: ease-in-out;

    /* mobile (<600) */
    --h2-size: 28px; --h2-lh: 36px; --h2-ls: 0px;
    --h4-size: 20px; --h4-lh: 26px;
    --section-pad: 32px;
    --title-gap: 24px;
    --card-pad: 16px;
    --card-radius: 16px;
    --cards-gap: 8px;
  }
  @media (min-width: 600px) {
    :root {
      --h2-size: 32px; --h2-lh: 40px; --h2-ls: 0.32px;
      --h4-size: 20px; --h4-lh: 28px;
      --section-pad: 48px;
      --title-gap: 32px;
      --card-pad: 24px;
      --card-radius: 24px;
      --cards-gap: 16px;
    }
  }
  @media (min-width: 1024px) {
    :root {
      --h2-size: 40px; --h2-lh: 48px; --h2-ls: 0.4px;
      --h4-size: 24px; --h4-lh: 32px;
      --section-pad: 64px;
      --title-gap: 40px;
      --card-pad: 32px;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--indigo);
    color: var(--ink);
    font-family: 'Montserrat', Arial, sans-serif;
    font-size: 16px;
    line-height: 22px;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }

  .block { padding: var(--section-pad) 16px; background: var(--indigo); }
  .block__inner { max-width: 1200px; margin: 0 auto; }
  .block__title {
    margin: 0 0 var(--title-gap);
    color: var(--white);
    text-align: center;
    font-size: var(--h2-size);
    line-height: var(--h2-lh);
    font-weight: 700;
    letter-spacing: var(--h2-ls);
  }
  .block__content { display: grid; grid-template-columns: 1fr; gap: 16px; align-items: start; }
  .cards { display: flex; flex-direction: column; gap: var(--cards-gap); }

  .card { border-radius: var(--card-radius); background: var(--white); }
  .card__head {
    display: flex;
    width: 100%;
    min-height: 48px;
    align-items: center;
    gap: 16px;
    padding: var(--card-pad);
    border: 0;
    border-radius: var(--card-radius);
    background: transparent;
    text-align: left;
    cursor: pointer;
    transition: padding var(--base) var(--ease-state);
  }
  .card__head:focus-visible { outline: 2px solid var(--indigo); outline-offset: -4px; }
  .card[data-open] .card__head { padding-bottom: calc(var(--card-pad) / 2); }
  .card__ico { display: grid; flex: 0 0 auto; width: 40px; height: 40px; place-items: center; border-radius: 12px; background: var(--purple-light-20); color: var(--indigo); }
  .card__ico svg { width: 24px; height: 24px; }
  .card__title { flex: 1; font-size: var(--h4-size); line-height: var(--h4-lh); font-weight: 700; color: var(--ink); transition: color var(--fast) var(--ease-state); }
  .card__head:hover .card__title { color: var(--indigo); }
  .card__chev { flex: 0 0 auto; width: 24px; height: 24px; color: var(--indigo); transition: transform var(--base) var(--ease-state); }
  .card[data-open] .card__chev { transform: rotate(180deg); }
  .card__body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows var(--base) var(--ease-state); }
  .card[data-open] .card__body { grid-template-rows: 1fr; }
  .card__inner { min-height: 0; overflow: hidden; }
  .card__inner p { margin: 0 var(--card-pad); }
  .card__inner p + p { margin-top: 8px; }
  .card__inner p:last-child { margin-bottom: var(--card-pad); }

  .illu { display: none; }

  /* Tablet: one column, content 720 */
  @media (min-width: 600px) {
    .block__inner { max-width: 720px; }
  }
  /* Desktop: list 6/12 + sticky illustration 6/12 */
  @media (min-width: 1024px) {
    .block__inner { max-width: 1200px; }
    .block__content { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .illu {
      position: sticky;
      top: 24px;
      display: block;
      aspect-ratio: 592 / 712;
      overflow: hidden;
      border-radius: 24px;
      background: var(--white);
    }
    .illu img { display: block; width: 100%; height: 100%; object-fit: cover; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; }
  }
</style>
</head>

const ITEMS = [
  { icon: 'corporate-fare', title: 'Площадка', text: ['Подбираем варианты под количество участников, формат, бюджет и задачу мероприятия. Можем предложить несколько совершенно разных сценариев: например, классический конференц-зал или исторический особняк, где сама площадка становится частью события'] },
  { icon: 'event-note', title: 'Деловая программа', text: ['Помогаем собрать расписание, сессии и тайминг. Координируем спикеров, презентации, технические требования и удалённые подключения. Если у одного спикера выступление на 20 минут, а следующий должен подключиться из другой страны, это должно быть предусмотрено до начала конференции, а не в момент, когда он выходит на сцену'] },
  { icon: 'tune', title: 'Технический продакшн', text: ['Сцена, свет, звук, микрофоны, экраны, LED, кликеры, запись, трансляция, онлайн-подключения, синхронный перевод. Для каждой площадки заранее проверяем технические возможности и ограничения'] },
  { icon: 'person-check', title: 'Регистрация', text: ['Списки участников, бейджи, стойки, навигация, welcome-зона. Если на конференцию приезжают 300 человек одновременно, продумываем регистрацию так, чтобы они не потратили первые 20 минут мероприятия в очереди'] },
  { icon: 'campaign', title: 'Спикеры и VIP', text: ['Билеты, размещение, трансферы, райдеры и сопровождение', 'Для спикера можем собрать весь маршрут: прилетел → встретили → разместили → привезли на площадку → подготовили к выступлению → отвезли обратно'] },
  { icon: 'restaurant', title: 'Питание', text: ['Кофе-брейки, обеды, фуршеты и ужины. Причём смотрим не только на меню. Если на кофе-брейк есть 20 минут, важно, чтобы за эти 20 минут участники успели выпить кофе и пообщаться, а не провести всё время в очереди'] },
  { icon: 'directions-bus', title: 'Транспорт', text: ['Аэропорт, вокзал, отель, площадка, ресторан. Автобусы и шаттлы для участников, отдельные автомобили для спикеров и VIP-гостей'] },
];

document.getElementById('cards').innerHTML = ITEMS.map((it, i) => `
  <div class="card"${i === 0 ? ' data-open' : ''}>
    <button class="card__head" type="button" id="h${i}" aria-expanded="${i === 0}" aria-controls="p${i}">
      <span class="card__ico">${icon(it.icon)}</span><span class="card__title">${it.title}</span>${CHEV}
    </button>
    <div class="card__body" id="p${i}" role="region" aria-labelledby="h${i}"><div class="card__inner">${it.text.map((t) => `<p>${t}</p>`).join('')}</div></div>
  </div>`).join('');

/* One item open at a time; clicking the open item closes it */
document.getElementById('cards').addEventListener('click', (e) => {
  const head = e.target.closest('.card__head');
  if (!head) return;
  const card = head.closest('.card');
  const wasOpen = card.hasAttribute('data-open');
  document.querySelectorAll('.card').forEach((c) => {
    c.removeAttribute('data-open');
    c.querySelector('.card__head').setAttribute('aria-expanded', 'false');
  });
  if (!wasOpen) { card.setAttribute('data-open', ''); head.setAttribute('aria-expanded', 'true'); }
});
